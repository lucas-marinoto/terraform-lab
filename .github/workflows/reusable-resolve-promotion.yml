name: Reusable - Resolve Promotion

on:
  workflow_call:
    inputs:
      source_environment:
        description: GitHub environment from which the latest successful deployment is promoted
        required: true
        type: string
      aws_region:
        required: true
        type: string
      aws_account_id:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
    outputs:
      release_sha:
        description: Git SHA from the latest successful source deployment
        value: ${{ jobs.resolve.outputs.release_sha }}
      image_uri:
        description: Immutable target-account ECR image URI by digest
        value: ${{ jobs.resolve.outputs.image_uri }}
      image_digest:
        description: Target-account ECR digest
        value: ${{ jobs.resolve.outputs.image_digest }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      id-token: write

    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_digest: ${{ steps.image.outputs.image_digest }}

    steps:
      - name: Find latest successful source deployment
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ENV: ${{ inputs.source_environment }}
        shell: bash
        run: |
          DEPLOYMENTS=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/deployments?environment=${SOURCE_ENV}&per_page=50")

          RELEASE_SHA=""
          DEPLOYMENT_ID=""

          while read -r ID; do
            STATUS=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses?per_page=1" \
              --jq '.[0].state // empty')

            if [ "$STATUS" = "success" ]; then
              RELEASE_SHA=$(echo "$DEPLOYMENTS" | jq -r ".[] | select(.id == ${ID}) | .sha")
              DEPLOYMENT_ID="$ID"
              break
            fi
          done < <(echo "$DEPLOYMENTS" | jq -r '.[].id')

          if [ -z "$RELEASE_SHA" ] || [ "$RELEASE_SHA" = "null" ]; then
            echo "No successful deployment found for environment '${SOURCE_ENV}'."
            exit 1
          fi

          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

          {
            echo "## Promotion source"
            echo ""
            echo "- Environment: ${SOURCE_ENV}"
            echo "- Deployment ID: ${DEPLOYMENT_ID}"
            echo "- Release SHA: ${RELEASE_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure target AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          allowed-account-ids: ${{ inputs.aws_account_id }}
          role-session-name: gha-promote-${{ github.run_id }}

      - name: Resolve replicated image in target ECR
        id: image
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
        shell: bash
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$RELEASE_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "Image tag '${RELEASE_SHA}' is not available in target ECR '${ECR_REPOSITORY}'."
            echo "Configure ECR cross-account replication or copy the existing image without rebuilding it."
            exit 1
          fi

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${DIGEST}"

          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "## Target artifact"
            echo ""
            echo "- ECR tag: ${RELEASE_SHA}"
            echo "- Digest: ${DIGEST}"
            echo "- Immutable image: ${IMAGE_URI}"
          } >> "$GITHUB_STEP_SUMMARY"
